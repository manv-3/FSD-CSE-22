<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Products</title>

    <script>
        const URL = 'https://dummyjson.com/products?limit=100&skip=6';

        async function loadProducts() {
            try {
                const res = await fetch(URL);
                console.log(res);

                const data = await res.json();
                console.log(data.products);

                let rows = "";

                data.products.map((i, idx) => {
                    rows += `
                        <tr>
                            <td>${idx + 1}</td>
                            <td>${i.title}</td>
                            <td><img src=${i.images[0]}></td>
                            <td>${i.category}</td>
                            <td>${i.rating}</td>
                            <td>₹${i.price}</td>
                            <td>${i.stock}</td>
                        </tr>
                    `;
                });

                const el = document.getElementById("data");
                el.innerHTML = rows ;

            } catch (err) {
                console.log(err);
            }
        }
        function getRate(){
            URL="https://open.er-api.com/v6/latest/USD";
            try{
                const res=await fetch(URL);
                const data = await res.join();
                console.log("inr"data.rates.INR);
            

            }
            catch(err){
                console.logg("error":errr)
            }
        }
        loadProducts();
    </script>

    <style>
        table {
            width: 80vw;
            border-collapse: collapse;
            margin: auto;
        }

        th, td {
            border: 2px solid blue;
            text-align: center;
            padding: 8px;
        }

        th {
            background-color: lightblue;
        }
        img{
            width: 100px;
        }
    </style>
</head>

<body>

    <h1 style="text-align: center;">List of Products</h1>

    <table>
        <thead>
            <tr>
                <th>Sr. No.</th>
                <th>Title</th>
                <th>Images</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Price ₹</th>
                <th>Stock</th>
            </tr>
        </thead>

        <tbody id="data">
        </tbody>
    </table>

</body>
</html>
